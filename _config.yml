remote_theme: just-the-docs/just-the-docs

title: ISW Russia-Ukraine Knowledge Bundle
description: A structured knowledge base on the Russia-Ukraine war, distilled from ISW's near-daily Russian Offensive Campaign Assessments and special reports.

baseurl: /isw-okf
url: https://chabicht.github.io

permalink: /:path:output_ext

exclude:
  - sources/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .opencode/

search_enabled: true
heading_anchors: true
back_to_top: true

color_scheme: light

aux_links:
  "View on GitHub":
    - "https://github.com/chabicht/isw-okf"

# Just the Docs collections — we use the default "pages" collection
# which includes all top-level and nested .md files automatically.

# Sort children by title by default (alphabetical)
nav_sort: case_insensitive

# Enable collapsible navigation
collapse_inactive_chapters: true
